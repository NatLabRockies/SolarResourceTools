name: Build QCFIT executables

on:
  push:
    paths:
      - "SERI-QC_with_QCFIT/**"
  pull_request:
    paths:
      - "SERI-QC_with_QCFIT/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: QCFIT-windows
          - os: macos-latest
            artifact: QCFIT-macos
    defaults:
      run:
        working-directory: SERI-QC_with_QCFIT

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.24.4 pandas==1.5.3 scipy==1.10.1 matplotlib==3.7.2 Pillow==9.5.0 pytz seaborn pyinstaller

      - name: Build Windows application
        if: runner.os == 'Windows'
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed --onedir
          --name QCFIT --icon dataFiles/qcfit-icon.ico
          --add-data "dataFiles;dataFiles" qcfit_script.py

      - name: Build macOS application
        if: runner.os == 'macOS'
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed --onedir
          --name QCFIT --add-data "dataFiles:dataFiles" qcfit_script.py

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: SERI-QC_with_QCFIT/dist/QCFIT*
          if-no-files-found: error
          compression-level: 6
